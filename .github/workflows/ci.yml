name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No secrets needed: `pretest` / `prebuild` create an empty environment.local.ts.
      - run: npm test -- --watch=false
      - run: npm run build
